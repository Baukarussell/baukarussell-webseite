backend:
  name: github
  repo: Baukarussell/baukarussell-webseite
  branch: presentation-recovery-2026-11-10
  base_url: https://baukarussell-cms-test.pages.dev
  auth_endpoint: api/auth

# Das hier ist der Schalter für "Entwurf speichern" (Preview Workflow)
publish_mode: editorial_workflow

media_folder: "logos" 
public_folder: "/logos"

collections:
  - name: "events"
    label: "Events"
    folder: "events"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Eventname (z.B. Baukarussell x Montblanc)", name: "title", widget: "string"}
      - {label: "Leitsatz (grosser Titel auf der Eventseite)", name: "subtitle", widget: "string", required: false}
      - {label: "Location", name: "location", widget: "string", required: false}
      - {label: "Datum", name: "date", widget: "datetime"}
      - {label: "Titelbild", name: "image", widget: "image"}
      - {label: "Text", name: "body", widget: "markdown"}
      - label: "Galerie (mehrere Fotos)"
        name: "galerie"
        widget: "list"
        required: false
        fields:
          - {label: "Foto", name: "image", widget: "image"}

  - name: "projekte"
    label: "Projekte"
    folder: "projekte"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Projekte anzeigen (Haken setzen)", name: "aktiv", widget: "boolean", default: true}
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Datum", name: "date", widget: "datetime"}
      - {label: "Bild", name: "image", widget: "image"}
      - {label: "Beschreibung", name: "body", widget: "markdown"}

  - name: "mitglieder"
    label: "Mitglieder"
    folder: "mitglieder"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Firmenname", name: "title", widget: "string"}
      - {label: "Logo", name: "logo", widget: "image"}
      - {label: "Beschreibung", name: "body", widget: "markdown"}

  - name: "seiten"
    label: "Seiten (Über uns & Kontakt)"
    files:
      - label: "Startseite (index.html)"
        name: "startseite"
        file: "index.html"
        fields:
          - {label: "HTML-Code der Startseite", name: "body", widget: "code", default_language: "html"}
