name: Verify CMS build

on:
  push:
    branches:
      - cms-integration
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Upload built website
        uses: actions/upload-artifact@v4
        with:
          name: baukarussell-cms-preview
          path: dist/
